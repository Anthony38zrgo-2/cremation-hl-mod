//////////
// Cremation + Featureful — server features
// Base: halflife_featureful-2026-10-18/featureful/features/featureful_server.cfg
// Adaptado para horda Cremation (cs_mansion 4 oleadas + rapidcore).
// Requiere DLL mergeada (Fase 1). Sin la DLL nueva estos cvars se ignoran sin romper nada.
//////////

///////////
// PLAYER
///////////
player_maxhealth 100
player_maxarmor 100
// Fix engine bug: pararse sobre cadáver bloqueaba puertas/trenes
corpse_player_collision_fix true

///////////
// ITEMS
///////////
suit_light flashlight
suit_light_allow_both false
suit_sentences true
hev_dead_requires_suit false
nosuit_allow_healthcharger false
items_instant_drop true
tripmines_solid true
satchels_pickable true
weapon_p_models true

///////////
// WARPBALL (spawns de oleadas mansion)
///////////
alien_teleport_sound false
warpball_at_monster_center true

///////////
// COMMON MONSTERS BEHAVIOR — núcleo Fase 1
///////////
// No seguir golpeando al morir (evita ensañamiento con David/Quake en muerte larga)
monsters_stop_attacking_dying_monsters true
// ¡Clave mansion!: si muere el líder, elegir otro. Sin esto el squad se disuelve a mitad de oleada.
monsters_delegate_squad_leadership true
// Zombies comiendo carne/cadáveres para curarse: desactivado en mansion (rompe balance oleadas), activar solo rapidcore si se quiere
monsters_eat_for_health false
// Los monstermaker de mansion usan targetname -> no forzar espera 5s
monsters_spawned_named_wait_trigger false
// Evitar exploit: NPCs abriendo puertas con targetname de la mansion
monsters_open_named_doors false
// Cadáveres largos (bullsquid/garg) no bloquean al jugador al morir
dying_monsters_block_player false
// Cucarachas/hornets no bloquean puertas/trenes de la mansion
handle_tiny_creatures 2

///////////
// RELATIONSHIPS — respetar enemy_combat_policy.inc
// Cremation ya fuerza R_AL entre enemigos vía policy. Estos quedan en false
// para no pelear contra la policy hasta el merge C++ (Fase 1.3).
///////////
blackops_classify false
opfor_grunts_dislike_civilians false
medic_drop_healthkit false
racex_dislike_alien_military true
racex_dislike_gargs true
racex_dislike_alien_monsters false

///////////
// SCIENTISTS / BIGMOMMA / DOORS
///////////
scientist_random_heads 4
bigmomma_wait_fix false
bigmomma_lastnode_fix false
doors_open_in_move_direction false
doors_blocked_recheck true
doors_blocked_fade_corpses true
door_rotating_starts_open_fix false
env_spark_transit false
opfor_deadhaz false
tentacle_opfor_height false
