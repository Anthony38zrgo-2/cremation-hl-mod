// Cremation + Featureful — exec (cvars motor). Formato engine: valores entre comillas.
// Base: featureful_exec.cfg. Ajustado para cs_mansion (geometría con puertas giratorias + escalera norte).

// 0 = Anniversary (recomendado, evita aceleración excesiva de func_pushable)
pushablemode "0"

// 0 = pickup por toque (HL clásico, conserva corazones/loot actual)
pickup_policy "0"

// Triangulación de rutas. Mansion tiene puertas giratorias + escalera: 2 da mejores detours sin el coste de 3.
npc_tridepth "2"

// Aplicar tridepth a TODOS (no solo followers). Necesario para horda 41/81.
npc_tridepth_all "1"

// Olvidar enemigo tras 8s sin verlo. Evita que toda la oleada persiga eternamente al jugador escondido.
// 0 = vanilla (nunca olvidan). Cremation hoy = nunca olvidan.
npc_forget_enemy_time "8"

// Vagar/investigar tras el combate. 1 = corrige zombies clavados tras matar.
// Requiere merge DLL; con DLL vieja se ignora.
npc_active_after_combat "1"

// Melee (zombies) puede pathfind a elevaciones pequeñas (mesas/plataforma central mansion). Experimental pero necesario.
npc_get_to_enemy_nearest "1"

// Reintento hull-trace melee desde posiciones altas/bajas (fix zombies vs plataforma/escalera).
npc_trace_hull_attack_retry "1"

// No permitir patadas que muevan puertas/entidades por accidente en scripted_sequences.
npc_vanilla_kick_behavior "-1"

// Idle sounds requieren PVS (41/81 NPCs gritando fuera de PVS saturan). 1 = solo en PVS.
npc_idlesound_requires_pvs "1"

items_physics_fix "1"

// 2 = mostrar info (nombre+vida) solo de aliados al mirar. Útil para minion Necromancer + HECU aliados.
sp_allowmonsterinfo "2"
