// Valores iniciales de David. Los mismos valores se registran por defecto.
// Aplicar opcionalmente con: exec config/david.cfg
// cremation_david 0 conserva el zombie anterior en los nuevos spawns/mapas.
cremation_david 1
// Modo actual: una sola hitbox general, sin daño anatómico localizado.
cremation_david_local_damage 0
// David cae tumbado al bajar de la mitad de su salud inicial.
// Zona centrada en el jugador: otro enemigo cercano impide la carrera.
david_crowd_radius 256
david_clear_radius 320
// Daño regional efectivo, como fracción de la salud inicial del zombie.
// Los umbrales no restan daño extra a la salud corporal.
david_head_fraction 0.35
david_limb_fraction 0.25
